<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:14px}.b{box-shadow:inset 0 0 0 1px var(--gray-100)}.n{font:700 12px/1.2 var(--font-text)}.h{font:400 11px/1.2 var(--font-text);color:var(--gray-600)}.lg{width:var(--s);height:var(--s);overflow:hidden;position:relative;flex:none}.lg img{position:absolute;width:166%;left:-33%;top:-33%}</style></head><body><div style="display:flex;align-items:flex-end;gap:14px"><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:4px;height:4px;background:var(--itau-laranja);border-radius:3px"></div><div class="n">1</div><div class="h">4</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:8px;height:8px;background:var(--itau-laranja);border-radius:3px"></div><div class="n">2</div><div class="h">8</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:12px;height:12px;background:var(--itau-laranja);border-radius:3px"></div><div class="n">3</div><div class="h">12</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:16px;height:16px;background:var(--itau-laranja);border-radius:3px"></div><div class="n">4</div><div class="h">16</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:24px;height:24px;background:var(--itau-laranja);border-radius:3px"></div><div class="n">5</div><div class="h">24</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:32px;height:32px;background:var(--itau-laranja);border-radius:3px"></div><div class="n">6</div><div class="h">32</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:48px;height:48px;background:var(--itau-laranja);border-radius:3px"></div><div class="n">7</div><div class="h">48</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--itau-laranja);border-radius:3px"></div><div class="n">8</div><div class="h">64</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:96px;height:96px;background:var(--itau-laranja);border-radius:3px"></div><div class="n">9</div><div class="h">96</div></div></div></body></html>

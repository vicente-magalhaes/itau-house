<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:14px}.b{box-shadow:inset 0 0 0 1px var(--gray-100)}.n{font:700 12px/1.2 var(--font-text)}.h{font:400 11px/1.2 var(--font-text);color:var(--gray-600)}.lg{width:var(--s);height:var(--s);overflow:hidden;position:relative;flex:none}.lg img{position:absolute;width:166%;left:-33%;top:-33%}</style></head><body><div class="row"><div class="sw" style="align-items:center"><div style="width:72px;height:56px;background:var(--gray-100);border-radius:4px"></div><div class="n">xs</div><div class="h">4px</div></div><div class="sw" style="align-items:center"><div style="width:72px;height:56px;background:var(--gray-100);border-radius:8px"></div><div class="n">sm</div><div class="h">8px</div></div><div class="sw" style="align-items:center"><div style="width:72px;height:56px;background:var(--gray-100);border-radius:12px"></div><div class="n">md</div><div class="h">12px</div></div><div class="sw" style="align-items:center"><div style="width:72px;height:56px;background:var(--gray-100);border-radius:20px"></div><div class="n">lg</div><div class="h">20px</div></div><div class="sw" style="align-items:center"><div style="width:72px;height:56px;background:var(--gray-100);border-radius:28px"></div><div class="n">xl</div><div class="h">28px</div></div><div class="sw" style="align-items:center"><div style="width:72px;height:56px;background:var(--gray-100);border-radius:999px"></div><div class="n">pill</div><div class="h">999px</div></div></div></body></html>

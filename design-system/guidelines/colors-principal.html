<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:14px}.b{box-shadow:inset 0 0 0 1px var(--gray-100)}.n{font:700 12px/1.2 var(--font-text)}.h{font:400 11px/1.2 var(--font-text);color:var(--gray-600)}.lg{width:var(--s);height:var(--s);overflow:hidden;position:relative;flex:none}.lg img{position:absolute;width:166%;left:-33%;top:-33%}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:#FF6200;height:80px"></div><div class="n">Laranja Itaú</div><div class="h">#FF6200</div></div><div class="sw"><div class="chip b" style="background:#FFFFFF;height:80px"></div><div class="n">Branco</div><div class="h">#FFFFFF</div></div><div class="sw"><div class="chip" style="background:#000000;height:80px"></div><div class="n">Preto</div><div class="h">#000000</div></div></div></body></html>

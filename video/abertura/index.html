<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/ias.js"></script>
    <style>
      @font-face {
        font-family: "Mulish";
        font-style: normal;
        font-weight: 200 1000;
        src: url("assets/Mulish-Latin.woff2") format("woff2");
      }
      :root {
        --laranja: #ff6200;
        --branco: #ffffff;
        --preto: #000000;
        --cinza-50: #f1f2f4;
        --cinza-100: #e3e5e8;
        --cinza-200: #cfd1d3;
        --cinza-400: #999999;
        --cinza-500: #6e6e6e;
        --cinza-600: #4c4c4c;
        --titulo: 104px;
        --texto: 22px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--branco); }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        background: var(--branco); color: var(--preto); font-family: "Mulish", Arial, sans-serif;
      }
      #cena { position: absolute; inset: 0; }

      /* ---------- Roda (2.5D: tudo é calculado por tempo em render()) ---------- */
      #roda, #cam { position: absolute; inset: 0; transform-origin: 1330px 585px; }
      #plano { position: absolute; inset: 0; overflow: visible; }
      .chip {
        position: absolute; left: 0; top: 0; width: 150px; height: 150px; margin: -75px 0 0 -75px;
        will-change: transform, filter, opacity;
      }
      .face {
        width: 150px; height: 150px; border-radius: 999px; background: var(--branco);
        display: grid; place-items: center; color: var(--preto);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.14), 0 2px 6px rgba(0, 0, 0, 0.08);
      }
      .face svg { width: 66px; height: 66px; }
      .foco-anel {
        position: absolute; left: -12px; top: -12px; width: 174px; height: 174px; border-radius: 999px;
        border: 5px solid var(--laranja); opacity: 0;
      }
      .chip.foco .nome { color: var(--preto); }
      .face.futuro { background: var(--cinza-50); border: 3px dashed var(--cinza-400); box-shadow: none; }
      .interrogacao { font-weight: 800; font-size: 64px; line-height: 1; color: var(--cinza-500); }
      .nome {
        position: absolute; left: 50%; top: 170px; width: 260px; margin-left: -130px; text-align: center;
        font-weight: 700; font-size: var(--texto); color: var(--cinza-600); white-space: nowrap;
      }
      #logo { position: absolute; left: 1330px; top: 545px; width: 0; height: 0; z-index: 30; }
      #logo-img { position: absolute; left: -175px; top: -175px; width: 350px; height: 350px; display: block; }
      .onda {
        position: absolute; left: -105px; top: -105px; width: 210px; height: 210px;
        border: 5px solid var(--laranja); border-radius: 56px; opacity: 0;
      }
      #logo-nome {
        position: absolute; left: -200px; top: 150px; width: 400px; text-align: center;
        font-weight: 800; font-size: var(--texto); letter-spacing: 0.02em; color: var(--preto); opacity: 0;
      }
      #sombra {
        position: absolute; left: 1220px; top: 560px; width: 220px; height: 60px; border-radius: 50%;
        background: var(--cinza-200); filter: blur(16px); z-index: 1;
      }

      /* ---------- Texto ---------- */
      #texto { position: absolute; left: 140px; top: 120px; width: 920px; height: 840px; }
      .grupo { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 36px; }
      .titulo { font-weight: 800; font-size: var(--titulo); line-height: 1.04; letter-spacing: -0.02em; }
      #g-final { perspective: 900px; }
      .frases { position: relative; height: 220px; }
      .frase { position: absolute; left: 0; top: 0; width: 920px; color: var(--laranja); opacity: 0; }
      .palavra { display: inline-block; opacity: 0; }
      .final-2 { color: var(--laranja); opacity: 0; transform-origin: left center; }

      #topo { position: absolute; left: 140px; top: 72px; font-weight: 800; font-size: var(--texto); letter-spacing: 0.02em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <div id="cena" class="clip" data-start="0" data-duration="15" data-track-index="0">
        <div id="roda" data-layout-allow-overflow="true">
        <div id="cam" data-layout-allow-overflow="true">
          <svg id="plano" width="1920" height="1080" viewBox="0 0 1920 1080">
            <ellipse id="anel-dentro" fill="none" stroke="#E3E5E8" stroke-width="2" stroke-dasharray="4 14" />
            <ellipse id="anel" fill="none" stroke="#CFD1D3" stroke-width="2.5" pathLength="1" />
            <ellipse id="anel-fora" fill="none" stroke="#CFD1D3" stroke-width="2" stroke-dasharray="3 18" />
            <g id="fios"></g>
            <g id="particulas"></g>
          </svg>
          <div id="sombra"></div>
          <div id="chips"></div>
          <div id="logo">
            <div class="onda" id="onda-0"></div>
            <div class="onda" id="onda-1"></div>
            <div class="onda" id="onda-2"></div>
            <div class="onda" id="onda-3"></div>
            <img id="logo-img" src="assets/itau-logo-pos.png" alt="Itaú" />
            <div id="logo-nome">Itaú House</div>
          </div>
        </div>

        </div>

        <div id="topo">Itaú House</div>

        <div id="texto">
          <div class="grupo" id="g-fases">
            <div class="titulo" id="titulo-fixo">O Itaú House se encaixa na IA</div>
            <div class="titulo frases">
              <div class="frase" id="frase-0"><div>do seu squad:</div><div>o Copilot.</div></div>
              <div class="frase" id="frase-1"><div>que vocês vão</div><div>usar amanhã.</div></div>
              <div class="frase" id="frase-2"><div>que ainda nem</div><div>existe.</div></div>
            </div>
          </div>

          <div class="grupo" id="g-final">
            <div class="titulo" id="final-1"></div>
            <div class="titulo final-2" id="final-2"><div>Não um serviço</div><div>que depende dela.</div></div>
          </div>
        </div>

      </div>
    </div>

    <script>
      // ---------- Roteiro ----------
      const P1 = 1.6; // Hoje: as IAs entram (antes disso, só o logo no centro)
      const P2 = 4.6; // Amanhã
      const P3 = 7.4; // Daqui a alguns anos
      const PF = 10.0; // Fecho
      const FIM = 15;
      const FASES = [
        ["chatgpt", "claude", "gemini", "copilot"],
        ["llama", "mistral", "deepseek", "perplexity"],
        [null, null, null, null],
      ];
      const FECHO = ["claude", "llama", null, "gemini"];
      const RODIZIO = ["chatgpt", "claude", "gemini", "copilot", "llama", "mistral", "deepseek", "perplexity", null];

      // Geometria da roda (px do quadro)
      const CX = 1330, CY = 585, RX = 410, LIFT = 40;
      const OMEGA = (2 * Math.PI) / 30;
      const DESLOCA = (5 * Math.PI) / 4 - (P1 + 1.3) * OMEGA;

      // ---------- Agenda de trocas de cada vaga: [tempo, id] ----------
      const agenda = [0, 1, 2, 3].map((i) => [[-1, FASES[0][i]]]);
      [P2, P3].forEach((T, f) => agenda.forEach((a, i) => a.push([T + i * 0.07, FASES[f + 1][i]])));
      agenda.forEach((a, i) => a.push([PF + i * 0.07, FECHO[i]]));
      {
        // Rodízio rápido no fecho: uma vaga por vez, sempre uma IA que não está na roda.
        const atual = FECHO.slice();
        let n = 0;
        for (let t = PF + 0.7; t < PF + 2.4; t += 0.3, n++) {
          const i = n % 4;
          let j = RODIZIO.indexOf(atual[i]);
          do j = (j + 1) % RODIZIO.length;
          while (atual.includes(RODIZIO[j]));
          atual[i] = RODIZIO[j];
          agenda[i].push([t, atual[i]]);
        }
        // No quadro final, o Copilot fica na vaga da frente.
        const aFim = (i) => DESLOCA + FIM * OMEGA + 3 * (Math.PI / 2) + (i * Math.PI) / 2 - Math.PI / 4;
        const frente = [0, 1, 2, 3].reduce((m, i) => (Math.sin(aFim(i)) > Math.sin(aFim(m)) ? i : m), 0);
        if (atual[frente] !== "copilot") {
          const outra = atual.indexOf("copilot");
          if (outra >= 0) {
            const livre = RODIZIO.find((v) => v !== null && !atual.includes(v));
            atual[outra] = livre;
            agenda[outra].push([PF + 2.6, livre]);
          }
          atual[frente] = "copilot";
          agenda[frente].push([PF + 2.7, "copilot"]);
        }
      }

      // ---------- Utilidades ----------
      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const inOut3 = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
      const out4 = (u) => 1 - Math.pow(1 - u, 4);
      const backOut = (u, s = 1.9) => 1 + (s + 1) * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2);
      const smooth = (a, b, t) => { const u = clamp((t - a) / (b - a)); return u * u * (3 - 2 * u); };
      const NS = "http://www.w3.org/2000/svg";

      // Ângulo da roda: giro constante + um "chicote" de 1/4 de volta em cada troca de fase.
      // Calmo: uma volta a cada 30s, e o Copilot (vaga 3) passa pela frente no meio do Hoje.
      function angulo(t) {
        let a = DESLOCA + t * OMEGA;
        for (const T of [P2, P3, PF]) a += (Math.PI / 2) * inOut3(clamp((t - (T - 0.5)) / 1.0));
        return a;
      }
      // Destaque do Copilot, a IA que o Itaú usa hoje.
      const foco = (t) => smooth(P1, P1 + 0.5, t) * (1 - smooth(P2 - 0.35, P2, t));
      // Inclinação do plano (a câmera sobe devagar) = razão entre os raios da elipse.
      const incl = (t) => 0.3 + 0.12 * smooth(0, FIM, t);
      // Brilho laranja dos fios em cada troca.
      function clarao(t) {
        let v = 0;
        for (const T of [P2, P3, PF]) if (t >= T - 0.1) v = Math.max(v, Math.exp(-(t - T + 0.1) * 4));
        return v * 0.55;
      }

      function htmlDaFace(id) {
        const ia = id && window.IAS[id];
        if (!ia) return '<div class="face futuro"><span class="interrogacao">?</span></div><div class="nome">Próxima IA</div>';
        return `<div class="face"><svg viewBox="0 0 24 24" fill="currentColor"><path d="${ia.d}"/></svg></div><div class="nome">${ia.nome}</div>`;
      }

      // ---------- Monta o DOM da roda ----------
      const chipsEl = document.getElementById("chips");
      const fiosEl = document.getElementById("fios");
      const partEl = document.getElementById("particulas");
      const chips = [0, 1, 2, 3].map((i) => {
        const el = document.createElement("div");
        el.className = "chip";
        el.id = "chip-" + i;
        const anelFoco = document.createElement("div");
        anelFoco.className = "foco-anel";
        const conteudo = document.createElement("div");
        el.append(anelFoco, conteudo);
        chipsEl.appendChild(el);
        const fio = document.createElementNS(NS, "line");
        fio.setAttribute("stroke", "#CFD1D3");
        fio.setAttribute("stroke-width", "2");
        const brilho = document.createElementNS(NS, "line");
        brilho.setAttribute("stroke", "#FF6200");
        brilho.setAttribute("stroke-width", "4");
        brilho.setAttribute("stroke-linecap", "round");
        const pulso = document.createElementNS(NS, "circle");
        pulso.setAttribute("r", "7");
        pulso.setAttribute("fill", "#FF6200");
        fiosEl.append(fio, brilho, pulso);
        return { el, anelFoco, conteudo, fio, brilho, pulso, id: undefined };
      });
      const particulas = Array.from({ length: 14 }, (_, j) => {
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("fill", j % 5 === 0 ? "#FF6200" : "#B3B3B3");
        partEl.appendChild(c);
        return c;
      });
      const anel = document.getElementById("anel");
      const anelDentro = document.getElementById("anel-dentro");
      const anelFora = document.getElementById("anel-fora");
      const logo = document.getElementById("logo");
      const sombra = document.getElementById("sombra");
      anel.setAttribute("stroke-dasharray", "1 1");

      // ---------- Render: tudo que é 2.5D sai daqui, só em função do tempo ----------
      function render(t) {
        const k = incl(t);
        const RY = RX * k;
        const A = angulo(t);
        const brilho = clarao(t);

        // Anéis no plano
        for (const [el, f] of [[anel, 1], [anelDentro, 0.55], [anelFora, 1.2]]) {
          el.setAttribute("cx", CX); el.setAttribute("cy", CY);
          el.setAttribute("rx", RX * f); el.setAttribute("ry", RY * f);
        }
        anel.setAttribute("stroke-dashoffset", String(1 - out4(clamp((t - 0.25) / 0.9))));
        const anelVis = smooth(0.2, 0.8, t);
        anelDentro.setAttribute("stroke-dashoffset", String(-A * 60));
        anelFora.setAttribute("stroke-dashoffset", String(A * 90));
        anelDentro.setAttribute("opacity", anelVis);
        anelFora.setAttribute("opacity", anelVis);

        // Partículas no anel de fora, com profundidade
        particulas.forEach((c, j) => {
          const a = A * 0.7 + (j * 2 * Math.PI) / particulas.length;
          const d = (Math.sin(a) + 1) / 2;
          c.setAttribute("cx", CX + Math.cos(a) * RX * 1.2);
          c.setAttribute("cy", CY + Math.sin(a) * RY * 1.2);
          c.setAttribute("r", 2.5 + d * 3.5);
          c.setAttribute("opacity", anelVis * (0.35 + 0.65 * d));
        });

        // Logo flutuando acima do plano e a sombra embaixo
        const flutua = Math.sin(t * 1.9) * 7;
        logo.style.transform = `translate(0px, ${flutua}px)`;
        const s = 1 - flutua / 90;
        sombra.style.transform = `scale(${s}, ${s * (k / 0.36)})`;
        sombra.style.opacity = String(smooth(0.3, 0.9, t) * 0.85);

        // Vagas
        chips.forEach((c, i) => {
          const a = A + (i * Math.PI) / 2 - Math.PI / 4;
          const x = CX + Math.cos(a) * RX;
          const y = CY + Math.sin(a) * RY;
          const d = (Math.sin(a) + 1) / 2; // 0 = fundo, 1 = frente

          // Qual IA está na vaga agora e quão perto da troca (para o giro de moeda)
          const ag = agenda[i];
          let id = ag[0][1], perto = 1, desde = 99;
          for (const [ts, v] of ag) {
            if (t >= ts) { id = v; desde = t - ts; }
            if (ts > 0) perto = Math.min(perto, Math.abs(t - ts) / 0.09);
          }
          if (c.id !== id) { c.conteudo.innerHTML = htmlDaFace(id); c.id = id; }

          // O Copilot entra primeiro e sozinho; as outras chegam depois.
          const e0 = i === 3 ? P1 : P1 + 0.55 + i * 0.12;
          const fc = id === "copilot" ? foco(t) : 0;
          c.anelFoco.style.opacity = String(fc);
          c.el.className = fc > 0.5 ? "chip foco" : "chip";
          const entrada = clamp((t - e0) / 0.6);
          const pop = desde < 0.35 ? 1 + 0.06 * Math.sin((desde / 0.35) * Math.PI) : 1;
          const escala = (0.66 + 0.34 * d) * (entrada > 0 ? backOut(entrada, 1.3) : 0) * pop * (1 + 0.2 * fc);
          const giro = Math.min(clamp(perto), 1);
          const rotY = (1 - clamp(entrada * 1.6)) * 90;
          // Em destaque, o Copilot desce um pouco para não cobrir o logo.
          c.el.style.transform =
            `translate(${x}px, ${y + fc * 40}px) perspective(700px) rotateY(${rotY}deg) scale(${escala * Math.max(giro, 0.02)}, ${escala})`;
          c.el.style.opacity = String(clamp(entrada * 3) * (0.5 + 0.5 * d));
          c.el.style.filter = `blur(${((1 - d) * 2.4).toFixed(2)}px)`;
          c.el.style.zIndex = String(10 + Math.round(d * 40));

          // Fio do centro até a vaga, clarão laranja e pulso viajando para fora
          const fx = CX, fy = CY - LIFT * 0.5;
          const vis = clamp(entrada * 2);
          for (const ln of [c.fio, c.brilho]) {
            ln.setAttribute("x1", fx); ln.setAttribute("y1", fy);
            ln.setAttribute("x2", x); ln.setAttribute("y2", y);
          }
          c.fio.setAttribute("opacity", vis * (0.45 + 0.55 * d));
          c.brilho.setAttribute("opacity", vis * Math.max(brilho, fc * 0.85));
          const f = (((t - e0) * 0.95 + i * 0.25) % 1 + 1) % 1;
          c.pulso.setAttribute("cx", fx + (x - fx) * f);
          c.pulso.setAttribute("cy", fy + (y - fy) * f);
          c.pulso.setAttribute("opacity", vis * Math.sin(Math.PI * f));
        });
      }

      // ---------- Timeline ----------
      const tl = gsap.timeline({ paused: true });
      const driver = { t: 0 };
      tl.to(driver, { t: FIM, duration: FIM, ease: "none", onUpdate: () => render(driver.t) }, 0);

      // Câmera: entra de perto, dá um soco em cada troca e empurra devagar no fecho.
      tl.fromTo("#cam", { scale: 1.1 }, { scale: 1, duration: 1.6, ease: "power3.out" }, 0);
      // O logo abre sozinho no centro; quando o texto entra, a roda abre espaço à direita.
      tl.fromTo("#roda", { x: -370, scale: 1.14 }, { x: 130, scale: 0.88, duration: 1.2, ease: "power3.inOut" }, P1 - 0.5);
      [P2, P3].forEach((T) => {
        tl.to("#cam", { scale: 1.018, duration: 0.3, ease: "sine.out" }, T - 0.1);
        tl.to("#cam", { scale: 1, duration: 0.8, ease: "power2.out" }, T + 0.2);
      });
      tl.to("#cam", { scale: 1.04, duration: FIM - PF, ease: "sine.inOut" }, PF);

      // Logo: entra batendo, com ondas laranja em cada troca.
      tl.fromTo("#logo-img", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.05);
      [0.45, P2, P3, PF].forEach((T, n) => {
        tl.fromTo(`#onda-${n}`, { scale: 1, opacity: 0.5 }, { scale: 2, opacity: 0, duration: 1.1, ease: "power2.out" }, T);
        if (n > 0) {
          tl.to("#logo-img", { scale: 0.97, duration: 0.15, ease: "sine.in" }, T - 0.15);
          tl.to("#logo-img", { scale: 1, duration: 0.5, ease: "power2.out" }, T);
        }
      });
      tl.fromTo("#logo-nome", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, PF + 2.5);

      tl.fromTo("#topo", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.3);

      // Texto das fases

      // Texto das fases: a primeira linha fica, a segunda troca a cada fase.
      tl.fromTo("#titulo-fixo", { opacity: 0, y: 30, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, P1 - 0.1);
      const inicios = [P1 + 0.1, P2, P3];
      const fins = [P2, P3, PF];
      inicios.forEach((T, n) => {
        tl.fromTo(`#frase-${n}`, { opacity: 0, yPercent: 20, filter: "blur(6px)" }, { opacity: 1, yPercent: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, T + 0.05);
        if (n < 2) tl.to(`#frase-${n}`, { opacity: 0, yPercent: -15, filter: "blur(4px)", duration: 0.25, ease: "power2.in" }, fins[n] - 0.25);
      });
      tl.to("#g-fases", { opacity: 0, y: -30, filter: "blur(6px)", duration: 0.35, ease: "power2.in" }, PF - 0.3);

      // Fecho: palavra por palavra, depois a frase laranja batendo.
      const final1 = document.getElementById("final-1");
      let nPalavra = 0;
      ["Um ecossistema", "que se adapta", "à IA."].forEach((linha) => {
        const l = document.createElement("div");
        linha.split(" ").forEach((w, i, arr) => {
          const s = document.createElement("span");
          s.className = "palavra";
          s.id = "palavra-" + nPalavra++;
          s.textContent = w;
          l.appendChild(s);
          if (i < arr.length - 1) l.appendChild(document.createTextNode(" "));
        });
        final1.appendChild(l);
      });
      tl.fromTo(".palavra", { opacity: 0, y: 30, rotationX: -40 }, { opacity: 1, y: 0, rotationX: 0, duration: 0.6, ease: "power3.out", stagger: 0.09 }, PF + 0.35);
      tl.fromTo("#final-2", { opacity: 0, scale: 1.08, filter: "blur(6px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, PF + 1.3);

      render(0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

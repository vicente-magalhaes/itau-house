[project]
name = "itau-house-mcp"
version = "0.1.0"
description = "Servidor MCP do Itaú House."
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "mcp==1.13.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not smoke'"
markers = ["smoke: requer o backend local da main na porta 8000"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]
